---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    # One job per gate family: failures name the gate, and they run in
    # parallel. Locally, `mise run ci` runs all of them.
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    env:
      RUNNER_TEST_SKIP: ${{ matrix.runner_test_skip }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            tasks: fmt-check
          - name: Vet and tidy
            tasks: "vet ::: tidy-check"
          - name: Codegen drift and proto compatibility
            tasks: "gen-check ::: proto-breaking ::: runner:gen-check"
          - name: Lint
            tasks: lint
          - name: Unit tests
            tasks: test
          - name: Upstream runner suite with patches
            tasks: "runner:test ::: runner:lint"
            # Chowns a socket to another uid, which needs root; GitHub runs
            # jobs as an unprivileged user (upstream's CI runs as root).
            runner_test_skip: "^TestDockerProxyWithDaemon$"
          - name: Helm chart
            tasks: "helm-lint ::: helm-docs-check"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # proto-breaking compares against main.
          fetch-depth: 0

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('**/go.sum', 'runner/UPSTREAM', 'runner/patches/*.patch') }}
          restore-keys: go-${{ runner.os }}-${{ matrix.name }}-

      - name: mise run ${{ matrix.tasks }}
        run: mise run ${{ matrix.tasks }}

  e2e:
    name: End-to-end (kind + Gitea, examples)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for the job images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          install_args: --locked

      - name: End-to-end suite
        run: mise run //test/e2e:test
