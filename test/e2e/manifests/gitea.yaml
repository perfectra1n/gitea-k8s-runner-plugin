# Throwaway Gitea for the e2e suite: rootless image, SQLite on emptyDir,
# Actions enabled. ROOT_URL is the in-cluster Service address, so the runner
# and job pods (actions/checkout) reach it the same way.
apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels: {app: gitea}
  template:
    metadata:
      labels: {app: gitea}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: gitea
          image: docker.gitea.com/gitea:1.27.3-rootless
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: GITEA__database__DB_TYPE, value: sqlite3}
            - {name: GITEA__database__PATH, value: /var/lib/gitea/gitea.db}
            - {name: GITEA__security__INSTALL_LOCK, value: "true"}
            - {name: GITEA__server__ROOT_URL, value: "http://gitea.gitea.svc.cluster.local:3000/"}
            - {name: GITEA__server__HTTP_PORT, value: "3000"}
            - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
            - {name: GITEA__actions__ENABLED, value: "true"}
            - {name: GITEA__actions__DEFAULT_ACTIONS_URL, value: github}
            - {name: GITEA__log__LEVEL, value: Warn}
          readinessProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /var/lib/gitea}
            - {name: config, mountPath: /etc/gitea}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: config, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  selector: {app: gitea}
  ports:
    - {name: http, port: 3000, targetPort: http}
