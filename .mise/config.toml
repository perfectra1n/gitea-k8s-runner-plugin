# mise tasks + tooling for gitea-k8s-runner-plugin. `mise tasks` lists them;
# `mise run <task>`. Mise is the source of truth for every toolchain and task, in
# developer shells and in CI (CI only ever calls `mise run <task>`).
#
# Monorepo task mode: the e2e harness tasks live next to the harness in
# `test/e2e/mise.toml` and run as `mise run //test/e2e:test` (or any sub-task,
# e.g. `//test/e2e:cluster-create`). Root tasks below stay invokable unprefixed.
monorepo_root = true

[settings]
experimental = true

[monorepo]
config_roots = ["test/e2e"]

[tools]
# Upstream gitea/runner declares `go 1.27`, so this is the floor.
go = "1.27.1"
buf = "1.73.0"
golangci-lint = "2.13.2"
kind = "0.33.0"
kubectl = "1.37.0"
helm = "4.3.0"
helm-docs = "1.14.2"
yq = "4.53.6"
shellcheck = "0.11.0"
actionlint = "1.7.12"
lefthook = "2.1.14"
shfmt = "3.14.1"

[env]
# Every build artifact, the patched upstream clone and the e2e kubeconfig live
# here (gitignored), so `git clean -fdX` is always a full reset.
BUILD_DIR = "{{config_root}}/.build"
GOFLAGS = "-trimpath"
CGO_ENABLED = "0"

[tasks.fmt]
description = "Format everything in place: Go (gofmt/goimports), proto (buf), shell (shfmt)"
run = [
  "golangci-lint fmt ./gen/... ./plugin/...",
  "buf format -w",
  "git ls-files -z --cached --others --exclude-standard '*.sh' | xargs -0 -r shfmt -w -i 2 -ci",
]

[tasks.fmt-check]
description = "Fail if any Go, proto or shell source is unformatted (CI gate)"
run = [
  "golangci-lint fmt --diff ./gen/... ./plugin/...",
  "buf format -d --exit-code",
  "git ls-files -z --cached --others --exclude-standard '*.sh' | xargs -0 -r shfmt -d -i 2 -ci",
]

[tasks.vet]
description = "go vet on every module (the compiler-adjacent correctness gate)"
run = "go vet ./gen/... ./plugin/..."

[tasks.tidy-check]
description = "Fail if any go.mod/go.sum is not tidy (dependency ratchet)"
run = """
set -eu
for m in gen plugin; do
  (cd "$m" && go mod tidy -diff) || { echo "$m/go.mod is not tidy: run 'go mod tidy' in $m" >&2; exit 1; }
done
"""

[tasks.proto-breaking]
description = "Fail on wire-incompatible proto changes against origin/main (skipped until main carries the proto)"
run = """
set -eu
ref=main
git rev-parse --verify -q origin/main >/dev/null && ref=origin/main
if git cat-file -e "$ref:proto/plugin/v1alpha/plugin.proto" 2>/dev/null; then
  buf breaking --against ".git#ref=$ref"
else
  echo "no proto on $ref yet; nothing to compare"
fi
"""

[tasks.lint]
description = "golangci-lint (plugin + gen), shellcheck on scripts, actionlint on workflows"
run = [
  "golangci-lint run ./gen/... ./plugin/...",
  "git ls-files -z --cached --others --exclude-standard '*.sh' | xargs -0 -r shellcheck",
  "if [ -d .github/workflows ]; then actionlint; fi",
]

[tasks.test]
description = "Hermetic unit tests for the protocol and plugin modules (no cluster, no network)"
# The race detector needs cgo; everything else builds with CGO_ENABLED=0.
env = { CGO_ENABLED = "1" }
run = "go test -race -count=1 ./gen/... ./plugin/..."

[tasks.gen]
description = "Generate Go code from proto/ with buf (protoc plugins via `go tool`, no network)"
run = ["buf lint", "buf generate"]

[tasks.gen-check]
description = "Fail if generated protocol code is stale (CI drift guard)"
run = """
set -eu
buf generate
drift=$(git status --porcelain -- ':(glob)gen/**/*.pb.go')
if [ -n "$drift" ]; then
  echo "$drift"
  echo "gen/ is stale: run 'mise run gen' and commit" >&2
  exit 1
fi
"""

[tasks.build]
description = "Build the plugin binary into .build/bin"
run = "go build -ldflags='-s -w' -o $BUILD_DIR/bin/gitea-k8s-runner-plugin ./plugin/cmd/gitea-k8s-runner-plugin"

[tasks.image-plugin]
description = "Build the plugin image (IMAGE_PREFIX/IMAGE_TAG override the ghcr.io name and :dev tag)"
run = "docker build -f plugin/Dockerfile -t ${IMAGE_PREFIX:-ghcr.io/perfectra1n}/gitea-k8s-runner-plugin:${IMAGE_TAG:-dev} ."

[tasks."runner:apply"]
description = "Clone gitea/runner at runner/UPSTREAM into .build/runner and apply runner/patches (FORCE=1 discards local work)"
run = "sh runner/scripts/apply.sh"

[tasks."runner:refresh"]
description = "Regenerate runner/patches from the commits on top of UPSTREAM in .build/runner"
run = "sh runner/scripts/refresh.sh"

[tasks."runner:test"]
description = "Apply the series to a fresh upstream clone, then vet + run upstream's own test suite (docker tests self-skip)"
depends = ["runner:apply"]
dir = "{{config_root}}/.build/runner"
# The clone sits under this repo's go.work; it is its own module. A dead
# DOCKER_HOST makes upstream's daemon-backed tests skip, keeping this hermetic.
env = { GOWORK = "off", CGO_ENABLED = "1" }
run = [
  "go vet ./...",
  # RUNNER_TEST_SKIP (a `go test -skip` regex) is for hosts where pristine
  # upstream itself fails (e.g. NixOS: /bin/sh is bash). Set it in the
  # gitignored .mise/config.local.toml, never here: CI runs everything.
  "go test -race -timeout 20m -parallel 8 ${RUNNER_TEST_SKIP:+-skip \"$RUNNER_TEST_SKIP\"} ./...",
]

[tasks."runner:build"]
description = "Apply the series and build the patched runner binary into .build/bin/gitea-runner"
depends = ["runner:apply"]
dir = "{{config_root}}/.build/runner"
env = { GOWORK = "off" }
run = "go build -ldflags='-s -w' -o ../bin/gitea-runner ."

[tasks.image-runner]
description = "Build the patched runner image from upstream's own Dockerfile (basic target) in the patched clone"
depends = ["runner:apply"]
run = "docker build --target basic --build-arg VERSION=${IMAGE_TAG:-dev} -t ${IMAGE_PREFIX:-ghcr.io/perfectra1n}/gitea-runner-k8s:${IMAGE_TAG:-dev} .build/runner"

[tasks.images]
description = "Build both images"
depends = ["image-plugin", "image-runner"]

[tasks.ci]
description = "The full local hermetic gate: format, codegen drift, lint, unit tests, upstream suite with our patches, chart"
depends = ["fmt-check", "vet", "tidy-check", "gen-check", "proto-breaking", "lint", "test", "runner:test"]
run = "echo '✓ local CI gate passed'"
