version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/perfectra1n/gitea-k8s-runner-plugin
run:
  timeout: 5m
