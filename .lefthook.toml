# Shared home-operations hooks (formatters, shellcheck, ...), plus the
# regeneration hooks for this repo's committed generated files. CI's gen-check
# and helm-docs-check are the backstop.
[[remotes]]
git_url = "https://github.com/home-operations/.github"
ref = "main"
configs = ["lefthook.common.toml"]

[pre-commit.commands.gen]
glob = ["proto/**/*.proto", "buf.yaml", "buf.gen.yaml"]
run = "mise run gen && git add gen/"

[pre-commit.commands.helm-docs]
glob = [
  "charts/gitea-runner-k8s/Chart.yaml",
  "charts/gitea-runner-k8s/values.yaml",
  "charts/gitea-runner-k8s/README.md.gotmpl",
]
run = "mise run helm-docs && git add charts/gitea-runner-k8s/README.md"

# Generated code and the generated chart README ship verbatim.
[pre-commit.commands.format-yaml]
exclude = ["charts/gitea-runner-k8s/templates/**"]

[pre-commit.commands.format-markdown]
exclude = ["charts/gitea-runner-k8s/README.md", "runner/patches/**"]
